[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-data-mart-etl"
version = "0.2.0"
description = "Ingestão auditável e consultas de projetos internos por ano"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1.5,<4", "psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
painel = ["streamlit>=1.50,<2"]

[project.scripts]
campus-etl = "campus_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
